<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#F2F4F9;--panel:#fff;--ink:#192033;--muted:#68728C;--line:#DDE2EE;--accent:#3D4FD6;--on-accent:#fff;--theirs:#E8ECF6;--side:#1E2766;--side-ink:#DCE1FF;--side-active:#3A47A8;--bad:#C0392B}
@media (prefers-color-scheme:dark){:root{--bg:#0F1220;--panel:#161A2C;--ink:#E6E9F7;--muted:#8D97B5;--line:#262C45;--accent:#7F8CFF;--on-accent:#0E1230;--theirs:#212741;--side:#0B0E24;--side-ink:#C7CDF5;--side-active:#2A3380;--bad:#FF8A7A}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:16px/1.45 'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gate{min-height:100%;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:14px}
.card h1{margin:0;font-size:2.2rem;letter-spacing:-.04em}
.card p{margin:0;color:var(--muted)}
.card .err{color:var(--bad);min-height:1.2em;font-size:.9rem}
.card .err.ok{color:var(--accent)}
label{display:grid;gap:6px;font-size:.9rem;color:var(--muted)}
.card button:not(.link),#form button,#newroom button{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.link{background:none;border:0;color:var(--accent);padding:4px;font-weight:600}

#app{height:100dvh;display:grid;grid-template-columns:64px 240px minmax(0,1fr)}
aside{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:18px;min-height:0}
.mark{font-size:1.9rem;font-weight:700;letter-spacing:-.04em;color:#fff;padding:0 8px}
#rooms{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
#rooms button{text-align:left;background:none;border:0;color:inherit;padding:8px 10px;border-radius:8px}
#rooms button::before{content:'#';opacity:.5;margin-right:6px}
#rooms button:hover{background:rgba(255,255,255,.07)}
#rooms button.on{background:var(--side-active);color:#fff}
#newroom{display:flex;gap:6px}
#newroom input{flex:1;min-width:0;background:rgba(255,255,255,.08);border-color:transparent;color:#fff}
#newroom input::placeholder{color:var(--side-ink);opacity:.6}
#newroom button{padding:8px 12px}
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
header h2{margin:0;font-size:1.15rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#live{width:8px;height:8px;border-radius:50%;background:var(--muted)}
#live.on{background:#2FB67C}
#who{color:var(--muted);font-size:.9rem}
#log{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:3px}
#empty{margin:auto;color:var(--muted)}
.msg{max-width:min(520px,80%);align-self:flex-start;display:flex;flex-direction:column}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.first{margin-top:12px}
.meta{font-size:.78rem;color:var(--muted);margin:0 4px 2px}
.bub{background:var(--theirs);padding:8px 12px;border-radius:16px 16px 16px 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.mine .bub{background:var(--accent);color:var(--on-accent);border-radius:16px 16px 4px 16px}
#form{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);align-items:flex-end}
#form textarea{flex:1;resize:none;max-height:120px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:700px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
  aside{flex-direction:row;align-items:center;padding:10px 12px;gap:10px;overflow:hidden}
  .mark{font-size:1.3rem;padding:0}
  #rooms{flex-direction:row;overflow-x:auto}
  #rooms button{white-space:nowrap}
  #newroom{flex:none}
  #newroom input{width:92px}
  #who,#sname,#invite{display:none}
  #rail{flex-direction:row;overflow-x:auto;padding:8px 12px}
  #newdm{flex:none}
  #newdm select{width:90px}
  header,#log,#form{padding-left:14px;padding-right:14px}
}
.msg{position:relative}
.ping .bub,.flash .bub,.flash .pic{outline:2px solid var(--accent);outline-offset:2px}
.at{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:4px;padding:0 3px;font-weight:600}
.mine .at{background:rgba(255,255,255,.25)}
.bub code{background:rgba(127,127,127,.25);border-radius:4px;padding:0 4px;font-family:ui-monospace,monospace;font-size:.9em}
.bub a{color:inherit;text-decoration:underline}
.ed{font-size:.72rem;opacity:.7;margin-left:6px}
.re{background:none;border:0;border-left:3px solid var(--line);color:var(--muted);font-size:.8rem;text-align:left;padding:0 8px;margin:0 4px 3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pic{max-width:min(300px,100%);border-radius:12px;display:block}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.rx:empty{display:none}
.rx button{background:var(--theirs);border:1px solid transparent;border-radius:10px;padding:1px 8px;font-size:.85rem}
.rx button.me{border-color:var(--accent)}
.bar{position:absolute;top:-16px;display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px;z-index:2}
.msg:not(.mine) .bar{left:8px}
.mine .bar{right:8px}
.msg:hover .bar,.msg:focus-within .bar{display:flex}
.bar button{background:none;border:0;border-radius:8px;padding:2px 7px;font-size:.82rem}
.bar button:hover{background:var(--theirs)}
@media (hover:none){.bar{position:static;display:flex;margin-top:3px}}
#ctx{display:flex;align-items:center;justify-content:space-between;padding:6px 20px;background:var(--theirs);font-size:.88rem;color:var(--muted)}
#ac,#gifs{margin:0 20px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
#ac button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px}
#ac button:hover{background:var(--theirs)}
#gifs{padding:10px;display:grid;gap:8px}
#gifs small{color:var(--muted)}
#gg{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto}
#gg img{height:80px;border-radius:8px;cursor:pointer}
#form .ghost{background:var(--theirs);color:var(--ink)}
#rail{background:color-mix(in srgb,var(--side) 70%,#000);padding:14px 8px;display:flex;flex-direction:column;gap:8px;align-items:center;overflow:auto}
#rail button{flex:none;width:44px;height:44px;border-radius:22px;border:0;background:var(--side-active);color:#fff;font-weight:700;transition:border-radius .15s}
#rail button:hover,#rail button.on{border-radius:14px}
#rail button.on{background:var(--accent);color:var(--on-accent)}
#sname{font-weight:600;color:#fff;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#invite{background:none;border:0;color:var(--side-ink);text-align:left;padding:0 8px;text-decoration:underline}
#rooms button[data-kind=dm]::before{content:'@'}
#newdm{display:flex;gap:6px}
#newdm select{flex:1;min-width:0;background:rgba(255,255,255,.08);color:#fff;border:0;border-radius:10px;padding:8px}
#newdm select option{color:#000}
#newdm button{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:8px 12px;font-weight:600}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:22px;max-width:380px;width:calc(100% - 32px)}
dialog[open]{display:grid;gap:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:grid;gap:8px}
dialog button:not(.link){background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
</style>
</head>
<body>

<section id="setup" class="gate" hidden>
  <form id="setupform" class="card">
    <h1>Murmur</h1>
    <p>Connect your Supabase project. Both values are under Project Settings, then API. They stay in this browser.</p>
    <label>Project URL<input id="url" type="url" placeholder="https://abcdefgh.supabase.co" required></label>
    <label>Anon key<input id="key" autocomplete="off" required></label>
    <button>Connect</button>
  </form>
</section>

<section id="auth" class="gate" hidden>
  <form id="authform" class="card">
    <h1>Murmur</h1>
    <p id="authlead">Sign in to pick up your conversations.</p>
    <label id="unwrap" hidden>Display name<input id="username" maxlength="24" autocomplete="nickname"></label>
    <label>Email<input id="email" type="email" autocomplete="email" required></label>
    <label>Password<input id="password" type="password" minlength="6" autocomplete="current-password" required></label>
    <p id="autherr" class="err" role="alert"></p>
    <button id="authbtn">Sign in</button>
    <button type="button" id="switch" class="link">New here? Create an account</button>
  </form>
</section>

<div id="app" hidden>
  <nav id="rail" aria-label="Servers"></nav>
  <aside>
    <div class="mark">Murmur</div>
    <div id="sname"></div>
    <button type="button" id="invite" hidden>Copy invite code</button>
    <nav id="rooms" aria-label="Rooms"></nav>
    <form id="newroom"><input id="roomname" placeholder="New room" maxlength="30" aria-label="New room name"><button>Add</button></form>
    <form id="newdm" hidden><select id="dmwho" aria-label="Start a conversation with"></select><button>Message</button></form>
  </aside>
  <main>
    <header>
      <h2 id="title"></h2>
      <span id="live" title="Realtime connection"></span>
      <span id="who"></span>
      <button id="out" class="link">Sign out</button>
    </header>
    <div id="log" aria-live="polite"><p id="empty" hidden>Nothing here yet. Send the first message.</p></div>
    <div id="ctx" hidden><span id="ctxt"></span><button type="button" id="ctxx" class="link">Cancel</button></div>
    <div id="ac" hidden></div>
    <div id="gifs" hidden><input id="gq" placeholder="Search GIFs" aria-label="Search GIFs"><div id="gg"></div><small>Powered by GIPHY</small></div>
    <form id="form">
      <button type="button" id="gifbtn" class="ghost">GIF</button>
      <textarea id="text" rows="1" maxlength="2000" placeholder="Write a message" aria-label="Message"></textarea>
      <button>Send</button>
    </form>
  </main>
</div>
<dialog id="dlg">
  <form id="mkserver"><label>Create a server<input id="sn" maxlength="30" placeholder="Server name" required></label><button>Create server</button></form>
  <form id="joinserver"><label>Join with an invite code<input id="jc" placeholder="Invite code" required></label><button>Join server</button></form>
  <form method="dialog"><button class="link">Close</button></form>
</dialog>
<div id="toast" role="status"></div>

<script>
// Your project. The anon key is designed to be public; row-level security protects the data.
const SUPABASE_URL = 'https://rhansjhjzmqucmwwhewv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoYW5zamhqem1xdWNtd3doZXd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNTYyNzEsImV4cCI6MjEwNjkzMjI3MX0.u1i-Js8Fx-ybBjb9k-lcPnfkfN1TIF2J39N10dauOjo';

const $ = s => document.querySelector(s);
const saved = () => { try { return JSON.parse(localStorage.getItem('murmur') || '{}'); } catch { return {}; } };
const GIPHY_KEY = ''; // a free key from developers.giphy.com turns on the GIF picker
const EMOJI = ['👍', '❤️', '😂', '🎉'];
let db, me = null, room = 'general', rooms = [], chan = null, last = null, msgs = new Map(), rx = new Map(), names = new Set(), ctx = null, signup = false, tt, gt, servers = [], people = new Map(), cur = 'home';

const show = id => ['setup', 'auth', 'app'].forEach(s => $('#' + s).hidden = s !== id);
const nameOf = u => u.user_metadata?.username || u.email.split('@')[0];
const clock = d => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 4000);
}
function setErr(msg, ok) { const e = $('#autherr'); e.textContent = msg; e.classList.toggle('ok', !!ok); }

function boot() {
  const url = SUPABASE_URL || saved().url, key = SUPABASE_ANON_KEY || saved().key;
  if (!url || !key) return show('setup');
  db = supabase.createClient(url, key);
  // Deferred so no Supabase call runs inside the auth callback itself.
  db.auth.onAuthStateChange((_e, s) => setTimeout(() => s?.user ? enter(s.user) : leave(), 0));
}

async function loadAll() {
  const [a, b, c] = await Promise.all([
    db.from('servers').select('*').order('created_at'),
    db.from('rooms').select('*').order('name'),
    db.from('profiles').select('*')]);
  const err = a.error || b.error || c.error;
  if (err) { toast(err.message); return false; }
  servers = a.data; rooms = b.data;
  people = new Map(c.data.map(x => [x.id, x.username]));
  people.forEach(n => names.add(n));
  return true;
}

async function enter(user) {
  if (me && me.id === user.id) return;
  me = user;
  $('#who').textContent = nameOf(user);
  show('app');
  if (!await loadAll()) return;
  await openView(servers[0]?.id ?? 'home');
  subscribe();
}

function leave() {
  if (chan) db.removeChannel(chan);
  chan = null; me = null; rooms = [];
  show('auth');
}

const visible = () => rooms.filter(r => cur === 'home' ? r.kind === 'dm' : r.server_id === cur);
const roomName = r => r.kind === 'dm' ? people.get(r.dm_a === me.id ? r.dm_b : r.dm_a) || 'Someone' : r.name;

function renderRail() {
  const rail = $('#rail'); rail.innerHTML = '';
  const add = (label, title, on, fn) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.title = title; b.className = on ? 'on' : ''; b.onclick = fn; rail.append(b);
  };
  add('DM', 'Direct messages', cur === 'home', () => openView('home'));
  servers.forEach(x => add(x.name.slice(0, 2), x.name, cur === x.id, () => openView(x.id)));
  add('+', 'Create or join a server', false, () => $('#dlg').showModal());
}

function renderRooms() {
  const nav = $('#rooms'); nav.innerHTML = '';
  const srv = servers.find(x => x.id === cur);
  $('#sname').textContent = srv ? srv.name : 'Direct messages';
  $('#invite').hidden = !srv; $('#newroom').hidden = !srv; $('#newdm').hidden = !!srv;
  if (!srv) {
    const sel = $('#dmwho'); sel.innerHTML = '';
    people.forEach((n, id) => { if (id !== me.id) sel.append(new Option(n, id)); });
  }
  visible().forEach(r => {
    const b = document.createElement('button');
    b.textContent = roomName(r); b.dataset.kind = r.kind; b.className = r.id === room ? 'on' : '';
    b.onclick = () => openRoom(r.id); nav.append(b);
  });
}

async function openView(v) {
  cur = v; renderRail();
  const first = visible()[0];
  if (first) return openRoom(first.id);
  room = null; msgs = new Map();
  $('#log').querySelectorAll('.msg').forEach(n => n.remove());
  $('#title').textContent = '';
  $('#empty').textContent = v === 'home' ? 'No conversations yet. Pick someone from the list to start one.' : 'No channels yet. Add one from the sidebar.';
  $('#empty').hidden = false;
  renderRooms();
}

async function openRoom(r) {
  room = r; last = null; msgs = new Map(); rx = new Map(); setCtx();
  renderRooms();
  const info = rooms.find(x => x.id === r);
  $('#title').textContent = info ? (info.kind === 'dm' ? '@' : '#') + roomName(info) : '';
  $('#empty').textContent = 'Nothing here yet. Send the first message.';
  $('#log').querySelectorAll('.msg').forEach(n => n.remove());
  $('#empty').hidden = true;
  const { data, error } = await db.from('messages').select('*').eq('room', r)
    .order('created_at', { ascending: false }).limit(100);
  if (error) return toast(error.message);
  if (room !== r) return;
  data.reverse().forEach(m => msgs.set(m.id, m));
  data.forEach(m => render(m));
  if (data.length) {
    const { data: rows } = await db.from('reactions').select('*').in('message_id', data.map(m => m.id));
    if (room !== r) return;
    (rows || []).forEach(x => rx.set(x.message_id, [...(rx.get(x.message_id) || []), x]));
    data.forEach(m => renderRx(m.id));
  }
  $('#empty').hidden = data.length > 0;
  const log = $('#log'); log.scrollTop = log.scrollHeight;
  $('#text').focus();
}

const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reName = (n, f) => new RegExp('@' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\w])', f);
const isImg = s => /^https?:\/\/\S+\.(gif|png|jpe?g|webp)(\?\S*)?$/i.test(s);

function fmt(t) {
  let h = esc(t)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*\n]+)\*/g, '<i>$1</i>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  [...names].sort((a, b) => b.length - a.length).forEach(n => { h = h.replace(reName(esc(n), 'gi'), '<span class="at">$&</span>'); });
  return h;
}

function render(m, old) {
  names.add(m.username);
  const mine = m.user_id === me.id, row = document.createElement('div');
  row.id = 'm-' + m.id;
  row.className = 'msg' + (mine ? ' mine' : '') + (!mine && reName(nameOf(me), 'i').test(m.content) ? ' ping' : '');
  if (old ? old.classList.contains('first') : last !== m.user_id || m.reply_to) {
    row.classList.add('first');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (mine ? '' : m.username + '  ') + clock(m.created_at);
    row.append(meta);
  }
  if (m.reply_to) {
    const t = msgs.get(m.reply_to), re = document.createElement('button');
    re.type = 'button'; re.className = 're';
    re.textContent = t ? 'Replying to ' + t.username + ': ' + (isImg(t.content) ? 'image' : t.content.slice(0, 70)) : 'Replying to an earlier message';
    re.onclick = () => {
      const el = $('#m-' + m.reply_to); if (!el) return;
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1500);
    };
    row.append(re);
  }
  if (isImg(m.content)) {
    const img = document.createElement('img');
    img.className = 'pic'; img.src = m.content; img.alt = 'Image or GIF from ' + m.username; img.loading = 'lazy';
    row.append(img);
  } else {
    const bub = document.createElement('div');
    bub.className = 'bub'; bub.title = clock(m.created_at);
    bub.innerHTML = fmt(m.content) + (m.edited_at ? '<span class="ed">(edited)</span>' : '');
    row.append(bub);
  }
  const box = document.createElement('div'); box.className = 'rx'; row.append(box);
  const bar = document.createElement('div'); bar.className = 'bar';
  const act = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = fn; bar.append(b); };
  EMOJI.forEach(e => act(e, () => react(m.id, e)));
  act('Reply', () => setCtx('reply', m));
  if (mine) { act('Edit', () => setCtx('edit', m)); act('Delete', () => del(m)); }
  row.append(bar);
  if (old) old.replaceWith(row); else { $('#log').append(row); last = m.user_id; }
  renderRx(m.id);
}

function addMsg(m) {
  if (m.room !== room || msgs.has(m.id)) return;
  msgs.set(m.id, m);
  $('#empty').hidden = true;
  const log = $('#log'), stick = m.user_id === me.id || log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  render(m);
  if (stick) log.scrollTop = log.scrollHeight;
}

function renderRx(id) {
  const box = document.querySelector('#m-' + id + ' .rx'); if (!box) return;
  const g = {};
  (rx.get(id) || []).forEach(r => (g[r.emoji] ??= []).push(r.user_id));
  box.innerHTML = '';
  Object.entries(g).forEach(([e, u]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = e + ' ' + u.length; b.className = u.includes(me.id) ? 'me' : '';
    b.onclick = () => react(id, e); box.append(b);
  });
}
function setRx(id, e, uid, on) {
  const a = (rx.get(id) || []).filter(r => !(r.user_id === uid && r.emoji === e));
  if (on) a.push({ user_id: uid, emoji: e });
  rx.set(id, a); renderRx(id);
}
async function react(id, e) {
  const has = (rx.get(id) || []).some(r => r.user_id === me.id && r.emoji === e);
  const { error } = has
    ? await db.from('reactions').delete().match({ message_id: id, user_id: me.id, emoji: e })
    : await db.from('reactions').insert({ message_id: id, emoji: e });
  if (error) return toast(error.message);
  setRx(id, e, me.id, !has);
}

async function del(m) {
  if (!confirm('Delete this message?')) return;
  const { error } = await db.from('messages').delete().eq('id', m.id);
  if (error) return toast(error.message);
  msgs.delete(m.id); $('#m-' + m.id)?.remove();
}

function setCtx(type, m) {
  const was = ctx?.type; ctx = type ? { type, m } : null;
  $('#ctx').hidden = !ctx;
  if (ctx) $('#ctxt').textContent = type === 'reply' ? 'Replying to ' + m.username : 'Editing message';
  if (type === 'edit') $('#text').value = m.content; else if (was === 'edit') $('#text').value = '';
  $('#text').focus();
}

function subscribe() {
  chan = db.channel('murmur')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
      const m = p.new;
      const info = rooms.find(x => x.id === m.room), dm = info?.kind === 'dm';
      if (m.user_id !== me.id && (dm ? m.room !== room : reName(nameOf(me), 'i').test(m.content)))
        toast(dm ? m.username + ' sent you a message' : m.username + ' mentioned you in #' + (info?.name ?? 'a channel'));
      addMsg(m);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, p => {
      if (p.new.room === room && msgs.has(p.new.id)) { msgs.set(p.new.id, p.new); render(p.new, $('#m-' + p.new.id)); }
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, p => {
      msgs.delete(p.old.id); $('#m-' + p.old.id)?.remove();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'reactions' }, p => msgs.has(p.new.message_id) && setRx(p.new.message_id, p.new.emoji, p.new.user_id, true))
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'reactions' }, p => msgs.has(p.old.message_id) && setRx(p.old.message_id, p.old.emoji, p.old.user_id, false))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'rooms' }, p => {
      if (!rooms.some(x => x.id === p.new.id)) { rooms.push(p.new); renderRooms(); }
    })
    .subscribe(s => $('#live').classList.toggle('on', s === 'SUBSCRIBED'));
}

// Sending
async function post(content) {
  const edit = ctx?.type === 'edit';
  const q = edit
    ? db.from('messages').update({ content, edited_at: new Date().toISOString() }).eq('id', ctx.m.id)
    : db.from('messages').insert({ room, content, reply_to: ctx?.m.id ?? null });
  const { data, error } = await q.select().single();
  if (error) { toast(error.message); return false; }
  if (edit) { msgs.set(data.id, data); render(data, $('#m-' + data.id)); } else addMsg(data);
  setCtx(); return true;
}
$('#form').onsubmit = async e => {
  e.preventDefault();
  const box = $('#text'), content = box.value.trim();
  if (!content) return;
  box.value = ''; box.style.height = 'auto'; $('#ac').hidden = true;
  if (!await post(content)) box.value = content;
};
$('#text').onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#form').requestSubmit(); }
  if (e.key === 'Escape') setCtx();
};
$('#text').oninput = e => {
  const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px';
  const m = t.value.slice(0, t.selectionStart).match(/@([^\s@]*)$/), ac = $('#ac');
  const hits = m ? [...names].filter(n => n.toLowerCase().startsWith(m[1].toLowerCase()) && n !== nameOf(me)).slice(0, 5) : [];
  ac.hidden = !hits.length; ac.innerHTML = '';
  hits.forEach(n => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '@' + n;
    b.onclick = () => { t.setRangeText('@' + n + ' ', t.selectionStart - m[0].length, t.selectionStart, 'end'); ac.hidden = true; t.focus(); };
    ac.append(b);
  });
};
$('#ctxx').onclick = () => setCtx();

// GIFs
async function gifSearch(q) {
  if (!GIPHY_KEY) { $('#gifs').hidden = true; return toast('GIFs need a free GIPHY key in GIPHY_KEY. You can also paste any image link.'); }
  const res = await fetch('https://api.giphy.com/v1/gifs/' + (q ? 'search' : 'trending') + '?api_key=' + GIPHY_KEY + '&limit=18&rating=pg-13&q=' + encodeURIComponent(q));
  const { data = [] } = await res.json().catch(() => ({}));
  const g = $('#gg'); g.innerHTML = '';
  data.forEach(x => {
    const i = document.createElement('img'); i.src = x.images.fixed_height_small.url; i.alt = x.title || 'GIF';
    i.onclick = () => { $('#gifs').hidden = true; if (ctx?.type === 'edit') setCtx(); post(x.images.fixed_height.url.split('?')[0]); };
    g.append(i);
  });
}
$('#gifbtn').onclick = () => { const p = $('#gifs'); p.hidden = !p.hidden; if (!p.hidden) { gifSearch(''); $('#gq').focus(); } };
$('#gq').oninput = e => { clearTimeout(gt); gt = setTimeout(() => gifSearch(e.target.value.trim()), 350); };

// Channels, DMs and servers
$('#newroom').onsubmit = async e => {
  e.preventDefault();
  const n = $('#roomname').value.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30);
  if (!n || cur === 'home') return;
  $('#roomname').value = '';
  const { data, error } = await db.from('rooms').insert({ name: n, server_id: cur }).select().single();
  if (error) return toast(error.code === '23505' ? 'That channel already exists in this server.' : error.message);
  if (!rooms.some(x => x.id === data.id)) rooms.push(data);
  openRoom(data.id);
};
$('#newdm').onsubmit = async e => {
  e.preventDefault();
  const id = $('#dmwho').value; if (!id) return;
  const { data, error } = await db.rpc('open_dm', { other: id });
  if (error) return toast(error.message);
  if (!rooms.some(x => x.id === data)) await loadAll();
  cur = 'home'; renderRail(); openRoom(data);
};
$('#mkserver').onsubmit = async e => {
  e.preventDefault();
  const { data, error } = await db.from('servers').insert({ name: $('#sn').value.trim() }).select().single();
  if (error) return toast(error.message);
  $('#sn').value = ''; $('#dlg').close(); await loadAll(); openView(data.id);
};
$('#joinserver').onsubmit = async e => {
  e.preventDefault();
  const { data, error } = await db.rpc('join_server', { code: $('#jc').value });
  if (error) return toast(error.message);
  $('#jc').value = ''; $('#dlg').close(); await loadAll(); openView(data);
};
$('#invite').onclick = async () => {
  const x = servers.find(v => v.id === cur); if (!x) return;
  try { await navigator.clipboard.writeText(x.invite); } catch {}
  toast('Invite code: ' + x.invite + '. Share it so others can join ' + x.name + '.');
};

// Auth
$('#switch').onclick = () => {
  signup = !signup; setErr('');
  $('#unwrap').hidden = !signup;
  $('#authbtn').textContent = signup ? 'Create account' : 'Sign in';
  $('#switch').textContent = signup ? 'Have an account? Sign in' : 'New here? Create an account';
  $('#authlead').textContent = signup ? 'Pick a display name so people know who is talking.' : 'Sign in to pick up your conversations.';
  $('#password').autocomplete = signup ? 'new-password' : 'current-password';
};
$('#authform').onsubmit = async e => {
  e.preventDefault(); setErr('');
  const email = $('#email').value.trim(), password = $('#password').value;
  if (signup) {
    const username = $('#username').value.trim();
    if (!username) return setErr('Enter a display name.');
    const back = location.protocol.startsWith('http') ? location.origin + location.pathname : undefined;
    const { data, error } = await db.auth.signUp({ email, password, options: { data: { username }, emailRedirectTo: back } });
    if (error) return setErr(error.message);
    if (!data.session) { setErr('Check your inbox to confirm your email, then sign in.', true); }
  } else {
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) setErr(error.message);
  }
};
$('#out').onclick = () => db.auth.signOut();

// Connect screen
$('#setupform').onsubmit = e => {
  e.preventDefault();
  localStorage.setItem('murmur', JSON.stringify({ url: $('#url').value.trim(), key: $('#key').value.trim() }));
  boot();
};

boot();
</script>
